# Small end-to-end run for a laptop (minutes, CPU only). Loaded on top of default.yaml.
paths:
  data: data_smoke
  results: results_smoke

stations:
  # 8 stations within 41 km of each other that pass the quality gate in 2020, 2024 and 2025
  include: ["05065", "05075", "05081", "05085", "05089", "05105", "05109", "06065"]

truth:
  min_rain_windows: 5

splits:
  A:
    train: ["2020-06-01", "2020-09-01"]
    val:   ["2024-07-01", "2024-08-01"]
    test:  ["2025-07-01", "2025-08-01"]
  B:
    train: ["2025-07-01", "2025-07-08"]
    val:   ["2025-07-08", "2025-07-10"]
    test:  ["2025-07-10", "2025-07-13"]

sampling:
  dry_keep_frac: 0.05

models:
  gbm:
    num_boost_round: 200
    early_stopping: 30
    shap_rows: 20000
  ssm_fit_rows: 300000
  hmm_em_iters: 8

deep:
  models: [samba, samba_nonlinear, samba_temporal_only, mamba, s4d, gru, tcn, patchtst]
  models_B: [samba, gru]
  window: 60
  batch_size: 128
  batch_size_by_model: {samba: 64, samba_nonlinear: 64, samba_temporal_only: 64, patchtst: 64, mamba: 64}
  eval_batch_size: 4096
  eval_batch_size_by_model: {samba: 512, samba_nonlinear: 512, samba_temporal_only: 512, patchtst: 512, mamba: 1024}
  epochs: 2
  max_steps_per_epoch: 15
  val_steps: 5
  d_model: 16
  d_state: 8
  expand: 1
  n_layers: 1
  device: cpu
  num_threads: 6

radar:
  workers: 6

evaluation:
  bootstrap: 50
